<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Radial aura -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Orbit Ring -->
  <ellipse cx="256" cy="256" rx="190" ry="85" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6" transform="rotate(-25 256 256)" />
  <ellipse cx="256" cy="256" rx="190" ry="85" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.4" transform="rotate(-25 256 256)" />

  <!-- Orbit Planet / Satellite -->
  <circle cx="390" cy="190" r="10" fill="#38bdf8" />
  <circle cx="390" cy="190" r="18" fill="#38bdf8" opacity="0.25" />

  <!-- Medical Cross / Diamond Constellation Node Behind -->
  <path d="M256 120 L266 170 L316 180 L266 190 L256 240 L246 190 L196 180 L246 170 Z" fill="#f59e0b" opacity="0.75" />

  <!-- Vital ECG Telemetry Pulse Wave -->
  <path d="M 90 256 L 165 256 L 195 210 L 225 310 L 255 140 L 285 360 L 315 220 L 340 275 L 360 256 L 422 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing nodes on waveform -->
  <circle cx="255" cy="140" r="8" fill="#ffffff" />
  <circle cx="285" cy="360" r="7" fill="#10b981" />
  <circle cx="195" cy="210" r="6" fill="#38bdf8" />

  <!-- ASTRA Typography Accent -->
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="9" fill="#94a3b8">ASTRA</text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#0284c7">HEALTH INTELLIGENCE</text>
</svg>
